function toggleLock(){locked=!locked;setLock()}function setLock(){document.querySelector('#lockIcon').textContent=locked?'🔒':'♙';document.querySelector('#lockText').textContent=locked?'Locked':'Lock'}
document.querySelector('#op').oninput=e=>{art.style.opacity=e.target.value/100;document.querySelector('#opv').textContent=e.target.value+'%'}
art.addEventListener('pointerdown',e=>{if(locked)return;drag={x:e.clientX,y:e.clientY,l:art.offsetLeft,t:art.offsetTop};art.setPointerCapture(e.pointerId)});
art.addEventListener('pointermove',e=>{if(!drag||locked)return;art.style.left=(drag.l+e.clientX-drag.x)+'px';art.style.top=(drag.t+e.clientY-drag.y)+'px'});art.addEventListener('pointerup',()=>drag=null)
function clearArt(){if(!locked){art.hidden=true;currentData=''}}
function saveCurrent(){if(!currentData){alert('Upload eerst een design.');return}let items=JSON.parse(localStorage.getItem('nailtrace_designs')||'[]');items.unshift({id:Date.now(),src:currentData,w:wmm,h:hmm,angle,flip});items=items.slice(0,30);localStorage.setItem('nailtrace_designs',JSON.stringify(items));alert('Design opgeslagen in NailTrace.');}
function renderSaved(){let items=JSON.parse(localStorage.getItem('nailtrace_designs')||'[]');saved.innerHTML='';if(!items.length){saved.innerHTML='<div class="empty" style="grid-column:1/-1">Nog geen opgeslagen designs.<br>Upload je eerste design hierboven.</div>';return}items.forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="thumb"><img src="${x.src}"></div><button class="delete">Open design</button>`;d.onclick=()=>openSaved(x);saved.appendChild(d)})}
function openSaved(x){currentData=x.src;art.src=x.src;art.hidden=false;wmm=x.w;hmm=x.h;angle=x.angle;flip=x.flip;locked=false;document.querySelector('#wv').textContent=wmm;document.querySelector('#hv').textContent=hmm;apply();setLock();show('studio')}
renderSaved();
</script>
</body></html>
